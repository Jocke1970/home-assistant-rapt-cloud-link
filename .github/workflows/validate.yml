name: Validate

on:
  push:
    branches:
      - dev
      - beta
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
      - beta
      - main
  workflow_dispatch:

jobs:
  python-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile integration
        run: python -m compileall -q custom_components/rapt_cloud_link
      - name: Check version and profile contract
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: home-assistant/actions/hassfest@master

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  publish-beta:
    # Release only after all beta-SHA checks pass; tag must remain immutable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    needs: [python-regression, validate-hassfest, validate-hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish RCL 2026.10.0b4 HACS prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("custom_components/rapt_cloud_link/manifest.json"))["version"])')"
          test "${version}" = "2026.10.0b4"
          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Existing ${tag} is immutable; refusing to repoint it."
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')" = "${GITHUB_SHA}"
            exit 0
          fi
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "RAPT Cloud Link ${version}" \
            --notes-file docs/releases/2026.10.0b4_sv.md \
            --prerelease
